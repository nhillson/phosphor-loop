name: Android app

# Builds Phosphor Loop for Android and puts it on the repository's Releases page,
# where a phone can download and install it. Runs whenever the android/ folder changes,
# or by hand from the Actions tab ("Run workflow").
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Put an offline copy of the site inside the app
        run: python3 android/tools/bundle_site.py

      - name: Build the app
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Explain a failed build
        if: failure()
        working-directory: android
        run: |
          python3 - <<'EOF'
          import os, re
          if not os.path.exists('build.log'):
              raise SystemExit
          lines = open('build.log', encoding='utf-8', errors='replace').read().splitlines()
          keep = []
          for i, l in enumerate(lines):
              if re.search(r'error:|: error|What went wrong|FAILURE:|Could not|Exception:|e: ', l):
                  keep.extend(lines[i:i + 4])
          text = '\n'.join(keep[:120]) or '\n'.join(lines[-60:])
          text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
          print('::error title=Android build failed::' + text)
          EOF

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PhosphorLoop.apk
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app PhosphorLoop.apk \
            --target "$GITHUB_SHA" --latest \
            --title "Phosphor Loop for Android (1.0.$GITHUB_RUN_NUMBER)" \
            --notes-file android/RELEASE_NOTES.md
